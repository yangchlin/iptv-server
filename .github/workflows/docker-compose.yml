name: 构建 ZTE 并推送 Docker 镜像

on:
  push:
    branches: [ "ZTE" ]
    tags: [ 'v*' ] # 当推送以 v 开头的标签（或页面发布 Release）时触发
  workflow_dispatch: # 允许在页面上手动点击按钮触发

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      # 【新增】设置 QEMU：让 x86 服务器能够编译 ARM 架构的镜像
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取 Docker 元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/epg-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # 【关键修改】同时编译 amd64 和 arm64 架构
          platforms: linux/amd64,linux/arm64
          # 覆盖 Dockerfile 默认的国内源，使用海外官方源
          build-args: |
            APT_MIRROR=deb.debian.org
            PIP_INDEX_URL=https://pypi.org/simple
            PIP_TRUSTED_HOST=
          # 使用上一步自动生成的标签
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 使用 GitHub Actions 缓存加快构建速度
          cache-from: type=gha
          cache-to: type=gha,mode=max

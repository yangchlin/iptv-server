# ============================================================================
# iptv-server nginx 配置（完整替换 /etc/nginx/nginx.conf）
# nginx:80 → uvicorn:127.0.0.1:8001
# ============================================================================

# Debian 打包的动态模块
include /etc/nginx/modules-enabled/*.conf;

# 容器本身以 root 运行；worker 也用 root，避免 NAS 上挂载目录属主/权限
# 导致 /epg.xml 直链 403（文件由 uvicorn 以 root 写入）
user  root;
worker_processes  auto;
pid  /run/nginx.pid;

# 主进程日志也直接进 docker logs
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    server_tokens off;

    sendfile           off;
    keepalive_timeout  65;

    # 上传上限：/api/share/upload 允许 200MB（前端 base64 后约 267MB）
    # nginx 默认只有 1m，不改这里上传一定 413
    client_max_body_size 300m;
    client_body_timeout  300s;

    add_header Cache-Control "no-store" always;

    # 只有真正带 Upgrade 头的请求才透传 upgrade，其余保持普通 HTTP
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80 default_server;
        server_name _;
        charset utf-8;

        # 拒绝下载生成中的临时文件（epg.xml.tmp 等）
        location ~ \.tmp$ {
            return 404;
        }

        # ---- EPG 静态直链（由 xml_builder 原子写入）----
        # 注意：nginx 的 add_header 一旦在子级出现就不再继承父级，
        # 所以这里必须重复写 Cache-Control。
        location = /epg.xml.gz {
            alias /app/data/xml/epg.xml.gz;
            default_type application/gzip;
            add_header Content-Disposition 'attachment; filename="epg.xml.gz"';
            add_header Cache-Control "no-store" always;
        }

        location = /epg.xml {
            alias /app/data/xml/epg.xml;
            default_type application/xml;
            add_header Content-Disposition 'attachment; filename="epg.xml"';
            add_header Cache-Control "no-store" always;
        }

        # ---- 其余请求交给 FastAPI ----
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;

            proxy_connect_timeout 10s;
            proxy_read_timeout    300s;
            proxy_send_timeout    300s;
        }
    }
}

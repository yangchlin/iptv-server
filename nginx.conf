# 加载动态模块（Debian 打包方式）
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 256;
}

# 四层端口映射（由 WEB 界面管理）
stream {
    include /etc/nginx/stream.d/*.conf;
}
http {
    access_log /dev/stdout;
    error_log /dev/stderr;
    
    sendfile off;
    keepalive_timeout 65;
    
    add_header Cache-Control "no-store";
    
    # 从 $request_uri 提取目标 URL（保留 // 不折叠）
    map $request_uri $proxy_target {
        ~^/(https?://?.+)$ $1;
    }
    
    # 代理访问日志格式（放 http 级别，不能在 server 内定义 log_format）
    log_format proxy_detail '$remote_addr|$time_local|$request|$status|$body_bytes_sent|'
                            '$upstream_addr|$upstream_bytes_received|'
                            '$request_time|$request_length';
    
    server {
        listen 80;
        charset utf-8;
        
        # 拒绝访问生成中的临时文件，防止下载到半成品
        location ~ \.tmp$ {
            deny all;
            return 404;
        }

        # EPG 静态文件
        location /epg.xml.gz {
            alias /app/data/xml/epg.xml.gz;
            default_type application/gzip;
            add_header Content-Disposition 'attachment; filename="epg.xml.gz"';
        }
        
        location /epg.xml {
            alias /app/data/xml/epg.xml;
            default_type application/xml;
            add_header Content-Disposition 'attachment; filename="epg.xml"';
        }
        
        # 其余请求代理到 uvicorn
        location / {
            proxy_pass http://127.0.0.1:8001;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }
    }
    
    # 代理转发端口 - nginx 直连（纯 C，不经过 Python）
    server {
        listen 8888;
        charset utf-8;

        # proxy_pass 变量需要 resolver
        resolver 114.114.114.114 8.8.8.8 valid=300s ipv6=off;

        # 跨源播放必需：允许 5673 播放器页跨源请求 manifest/片段/流（hls.js/mpegts.js）
        # always 保证 302 重定向等非 200 响应也携带 CORS 头，否则浏览器拦截
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Range, If-Range, Content-Type, User-Agent" always;
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;

        # 流式转发
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        location / {
            # 跨源预检（OPTIONS）直接放行（CORS 头由 server 层 add_header + always 提供，nginx 不允许在 if 内 add_header）
            if ($request_method = OPTIONS) {
                return 204;
            }

            # 回写 302 Location，用 $http_host 保持客户端原始端口
            proxy_redirect ~^http://(.+)$ $scheme://$http_host/http://$1;
            proxy_redirect ~^https://(.+)$ $scheme://$http_host/https://$1;

            # 纯 C 级直连转发
            proxy_pass $proxy_target;
        }
    }
}

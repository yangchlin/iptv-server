version: '3.8'

services:
  iptv-server:
    build: .
    container_name: iptv-server
    ports:
      - "5673:80"
      - "1234:8888"
      # 1234端口：HTTP代理转发
      # 端口映射，按需增删
      - "1233:1233"
    volumes:
      # 运行数据（json/xml/m3u/logs/config）通过 volume 挂载；
      # static 前端资源
      - /vol1/1000/Docker/IPTV/json:/app/data/json
      - /vol1/1000/Docker/IPTV/xml:/app/data/xml
      - /vol1/1000/Docker/IPTV/m3u:/app/data/m3u
      - /vol1/1000/Docker/IPTV/icons:/app/data/icons
      - /vol1/1000/Docker/IPTV/logs:/app/data/logs
      - /vol1/1000/Docker/IPTV/data:/app/data/config
      - /vol2/1000/JNAS/共享:/app/data/share
    environment:
      - TZ=Asia/Shanghai
      - PYTHONUNBUFFERED=1
      - AUTH_USERNAME=666
      - AUTH_PASSWORD=666
    restart: unless-stopped
    network_mode: bridge
    dns:
      - 114.114.114.114
      - 8.8.8.8
